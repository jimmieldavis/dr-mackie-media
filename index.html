// Computed Stats
function computeStats() {
  const byType = {}, byYear = {};
  const cities = new Set(), outlets = new Set();
  let tier1 = 0;
  MEDIA_DATA.forEach(m => {
    byType[m.type] = (byType[m.type] || 0) + 1;
    byYear[m.year] = (byYear[m.year] || 0) + 1;
    if (m.city && m.city !== "Remote" && m.city !== "[TBD]" && m.city !== "Remote / National" && m.city !== "National") {
      cities.add(m.city.split("/")[0].trim());
    }
    outlets.add(m.outlet);
    if (m.tier === "Tier 1") tier1++;
  });
  return { total: MEDIA_DATA.length, byType, byYear, cities: cities.size, outlets: outlets.size, tier1 };
}

const getCityCoords = (city) => {
  if (!city || city === "Remote" || city === "[TBD]" || city === "National" || city === "Remote / National" || city === "Virtual") return null;
  const key = city.toLowerCase().split("/")[0].trim();
  for (const [k, v] of Object.entries(CITY_COORDS)) {
    if (key.includes(k) || k.includes(key)) return v;
  }
  return null;
};

// US Map Component
const USMap = ({ data }) => {
  const svgRef = useRef(null);
  const [selCity, setSelCity] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(false);
  const [animDone, setAnimDone] = useState(false);

  const cityMap = {};
  data.forEach(m => {
    const coords = getCityCoords(m.city);
    if (!coords) return;
    const key = `${coords[0].toFixed(2)},${coords[1].toFixed(2)}`;
    if (!cityMap[key]) cityMap[key] = { lat: coords[0], lng: coords[1], city: m.city.split("/")[0].trim(), items: [] };
    cityMap[key].items.push(m);
  });
  const cities = Object.values(cityMap).map(c => ({
    ...c,
    items: c.items.sort((a,b) => new Date(a.date)-new Date(b.date)),
    first: c.items.reduce((e,m) => new Date(m.date)<new Date(e.date)?m:e, c.items[0]),
  })).sort((a,b) => new Date(a.first.date)-new Date(b.first.date));

  const maxCount = Math.max(1, ...cities.map(c => c.items.length));

  const stateCounts = {};
  data.forEach(m => {
    const city = (m.city||"").toLowerCase();
    if (city.includes("washington, d")) stateCounts["DC"]=(stateCounts["DC"]||0)+1;
    else if (city.includes(", ny")||city.includes("new york")) stateCounts["NY"]=(stateCounts["NY"]||0)+1;
    else if (city.includes(", fl")||city.includes("tallahassee")||city.includes("orlando")) stateCounts["FL"]=(stateCounts["FL"]||0)+1;
    else if (city.includes(", la")||city.includes("new orleans")||city.includes("baton rouge")||city.includes("grambling")) stateCounts["LA"]=(stateCounts["LA"]||0)+1;
    else if (city.includes(", ga")||city.includes("atlanta")||city.includes("fort valley")) stateCounts["GA"]=(stateCounts["GA"]||0)+1;
    else if (city.includes(", md")||city.includes("baltimore")) stateCounts["MD"]=(stateCounts["MD"]||0)+1;
    else if (city.includes(", tn")||city.includes("memphis")) stateCounts["TN"]=(stateCounts["TN"]||0)+1;
    else if (city.includes(", al")||city.includes("tuskegee")) stateCounts["AL"]=(stateCounts["AL"]||0)+1;
    else if (city.includes(", nj")||city.includes("princeton")) stateCounts["NJ"]=(stateCounts["NJ"]||0)+1;
    else if (city.includes(", co")||city.includes("denver")) stateCounts["CO"]=(stateCounts["CO"]||0)+1;
    else if (city.includes(", mn")||city.includes("minneapolis")) stateCounts["MN"]=(stateCounts["MN"]||0)+1;
    else if (city.includes(", wa")||city.includes("tacoma")) stateCounts["WA"]=(stateCounts["WA"]||0)+1;
    else if (city.includes(", nc")||city.includes("durham")) stateCounts["NC"]=(stateCounts["NC"]||0)+1;
    else if (city.includes(", ms")||city.includes("starkville")) stateCounts["MS"]=(stateCounts["MS"]||0)+1;
    else if (city.includes(", wi")||city.includes("milwaukee")) stateCounts["WI"]=(stateCounts["WI"]||0)+1;
    else if (city.includes(", va")||city.includes("fairfax")) stateCounts["VA"]=(stateCounts["VA"]||0)+1;
  });

  const selCityItems = selCity ? (cityMap[selCity]?.items || []).sort((a,b)=>new Date(b.date)-new Date(a.date)) : [];

  useEffect(() => {
    let mounted = true;
    setLoading(true); setErr(false); setAnimDone(false); setSelCity(null);
    const W = 600, H = 360;

    const loadMap = async () => {
      try {
        await new Promise((resolve, reject) => {
          if (window.topojson) { resolve(); return; }
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });

        const usRaw = await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(r=>r.json());
        if (!mounted) return;

        const states = window.topojson.feature(usRaw, usRaw.objects.states);
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const proj = d3.geoAlbersUsa().fitSize([W, H], states);
        const path = d3.geoPath().projection(proj);

        svg.append("g").selectAll("path")
          .data(states.features)
          .join("path")
          .attr("d", path)
          .attr("fill", "#111111")
          .attr("stroke", GREEN)
          .attr("stroke-width", 0.4)
          .attr("stroke-opacity", 0.3);

        if (mounted) setLoading(false);

        const DELAY = 65;
        cities.forEach((city, i) => {
          const coords = proj([city.lng, city.lat]);
          if (!coords) return;
          const [cx, cy] = coords;
          const key = `${city.lat.toFixed(2)},${city.lng.toFixed(2)}`;
          const n = city.items.length;
          const haloR = 5 + (n / maxCount) * 18;
          const haloOp = 0.15 + (n / maxCount) * 0.60;
          const coreR = 5;

          setTimeout(() => {
            if (!mounted) return;
            const g = svg.append("g")
              .attr("transform", `translate(${cx},${cy})`)
              .style("cursor", "pointer")
              .on("click", () => setSelCity(s => s===key ? null : key))
              .on("mouseenter", function() { d3.select(this).select("circle").attr("opacity", Math.min(haloOp + 0.15, 1)); })
              .on("mouseleave", function() { d3.select(this).select("circle").attr("opacity", haloOp); });

            g.append("circle").attr("r", 0).attr("fill", GREEN).attr("opacity", haloOp)
              .transition().duration(400).ease(d3.easeQuadOut).attr("r", haloR);
            g.append("circle").attr("r", 0).attr("fill", GREEN).attr("opacity", 1)
              .transition().duration(300).delay(150).ease(d3.easeBackOut.overshoot(2.2)).attr("r", coreR);
            g.append("title").text(`${city.city} - ${n} appearance${n>1?"s":""}`);

            if (i === cities.length - 1) {
              setTimeout(() => { if (mounted) setAnimDone(true); }, 400);
            }
          }, i * DELAY);
        });
      } catch(e) { if (mounted) { setErr(true); setLoading(false); } }
    };
    loadMap();
    return () => { mounted = false; };
  }, []);

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
      <div style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:"18px 20px", boxShadow:t.shadow }}>
        <div style={{ fontSize:15, fontWeight:600, color:t.textTitle, marginBottom:3 }}>Geographic Media Reach</div>
        <div style={{ fontSize:13, color:t.textSub, marginBottom:12 }}>
          {cities.length} cities across {Object.keys(stateCounts).length} states | Markers populate chronologically | Click any marker to expand
        </div>
        {loading && <div style={{ textAlign:"center", padding:"60px 0", color:t.textSub, fontSize:15 }}>Loading map...</div>}
        {err && <div style={{ textAlign:"center", padding:"60px 0", color:t.textSub, fontSize:15 }}>Map unavailable</div>}
        <svg ref={svgRef} viewBox="0 0 600 360" style={{ width:"75%", display:loading||err?"none":"block", margin:"0 auto" }} />
        {selCity && selCityItems.length > 0 && (
          <div style={{ marginTop:12, padding:"10px 14px", background:t.accentGlow, borderRadius:8, border:`1px solid ${t.border}` }}>
            <div style={{ fontSize:13, fontWeight:700, color:t.accent, marginBottom:8 }}>
              {cityMap[selCity]?.city} - {selCityItems.length} appearance{selCityItems.length>1?"s":""}
            </div>
            {selCityItems.map(m => (
              <div key={m.id} style={{ fontSize:13, color:t.text, padding:"3px 0 3px 10px", borderLeft:`2px solid ${t.accent}`, marginBottom:3, lineHeight:1.4 }}>
                <span style={{ fontWeight:600, color:t.textSub }}>{m.date.slice(5,7)}/{m.date.slice(0,4)}</span> | {m.title}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:12, padding:"16px 20px", boxShadow:t.shadow }}>
        <div style={{ fontSize:15, fontWeight:600, color:t.textTitle, marginBottom:3 }}>States and Appearances</div>
        <div style={{ fontSize:13, color:t.textSub, marginBottom:14 }}>Click any state to expand</div>
        <div style={{ columns:"2", columnGap:24 }}>
          {Object.entries(stateCounts).sort((a,b) => b[1]-a[1]).map(([ab, n]) => {
            const stateEntries = data.filter(m => {
              const c = (m.city||"").toLowerCase();

              if (ab==="GA") return c.includes(", ga")||c.includes("atlanta")||c.includes("fort valley");
              if (ab==="FL") return c.includes(", fl")||c.includes("tallahassee")||c.includes("orlando");
              if (ab==="NY") return c.includes(", ny")||c.includes("new york");
              if (ab==="MD") return c.includes(", md")||c.includes("baltimore");
              if (ab==="TN") return c.includes(", tn")||c.includes("memphis");
              if (ab==="AL") return c.includes(", al")||c.includes("tuskegee");
              if (ab==="NJ") return c.includes(", nj")||c.includes("princeton");
              if (ab==="CO") return c.includes(", co")||c.includes("denver");
              if (ab==="MN") return c.includes(", mn")||c.includes("minneapolis");
              if (ab==="WA") return c.includes(", wa")||c.includes("tacoma");
              if (ab==="NC") return c.includes(", nc")||c.includes("durham");
              if (ab==="MS") return c.includes(", ms")||c.includes("starkville");
              if (ab==="WI") return c.includes(", wi")||c.includes("milwaukee");
              if (ab==="VA") return c.includes(", va")||c.includes("fairfax");
              return false;
            }).sort((a,b) => new Date(b.date)-new Date(a.date));
            const open = selCity === ab;

              <div key={ab} style={{ breakInside:"avoid" }}>

                  </div>

                {open && (
                  <div style={{ padding:"6px 0 10px" }}>
                    {stateEntries.map(m => (
                      <div key={m.id} style={{ fontSize:12, padding:"4px 0 4px 10px", borderLeft:`2px solid ${t.accent}`, marginBottom:3, lineHeight:1.5 }}>
                        <div style={{ color:t.textSub, marginBottom:1 }}>{m.date.slice(5,7)}/{m.date.slice(0,4)}</div>

                              onMouseLeave={e => e.target.style.textDecoration="none"}>
                              {m.title.length > 50 ? m.title.slice(0,50)+"..." : m.title}
                            </a>
                          : <span style={{ color:t.text }}>{m.title.length > 50 ? m.title.slice(0,50)+"..." : m.title}</span>
                        }
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

  const useCountUp = (target, duration = 900) => {
    const [val, setVal] = useState(0);
    const num = parseFloat(String(target).replace(/[^0-9.]/g, ""));
    const suffix = String(target).replace(/[0-9.]/g, "");
    useEffect(() => {
      if (!num) { setVal(0); return; }
      let start = null;
      const step = (ts) => {
        if (!start) start = ts;
        const p = Math.min((ts - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        setVal(Math.round(ease * num));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);

    return val + suffix;
  };

    return (
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.72)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, backdropFilter:"blur(6px)", padding:24 }} onClick={() => setSelected(null)}>
        <div style={{ background:t.surface, border:`1px solid ${t.border}`, borderRadius:18, padding:"28px 32px", maxWidth:560, width:"100%", boxShadow:t.shadowLg, position:"relative" }} onClick={e => e.stopPropagation()}>
          <button style={{ position:"absolute", top:14, right:14, width:28, height:28, borderRadius:6, border:`1px solid ${t.border}`, background:t.surfaceAlt, color:t.textSub, cursor:"pointer", fontSize:16, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"sans-serif" }} onClick={() => setSelected(null)}>&#x2715;</button>
          <div style={{ display:"flex", gap:7, marginBottom:10, flexWrap:"wrap" }}>
            <span style={typeBadge(selected.type)}>{selected.type}</span>
            {selected.tier==="Tier 1" && <span style={{ fontSize:10, fontWeight:700, color:t.text, background:"transparent", padding:"2px 8px", borderRadius:4, letterSpacing:"0.06em", textTransform:"uppercase", border:`1px solid ${t.border}` }}>TIER 1</span>}
          </div>
          <div style={{ fontSize:20, fontWeight:800, color:t.text, lineHeight:1.3, marginBottom:5 }}>{selected.title}</div>
          <div style={{ fontSize:15, color:t.accent, fontWeight:600, marginBottom:14 }}>{selected.outlet}</div>
          <div style={{ display:"flex", gap:16, marginBottom:14, fontSize:14, color:t.textSub, flexWrap:"wrap" }}>
            <span style={{ display:"flex", gap:5, alignItems:"center" }}><Icon name="clock" size={12}/>{(d => `${d.slice(8,10)}-${["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][parseInt(d.slice(5,7))-1]}-${d.slice(0,4)}`)(selected.date)}</span>
            {selected.city && <span style={{ display:"flex", gap:5, alignItems:"center" }}><Icon name="pin" size={12}/>{selected.city}</span>}
          </div>
          <div style={{ fontSize:15, color:t.text, lineHeight:1.8, padding:"14px 16px", background:t.surfaceAlt, borderRadius:10, border:`1px solid ${t.border}`, marginBottom:16 }}>{selected.description}</div>
          {selected.url && selected.url !== "" ? (
            <a href={selected.url} target="_blank" rel="noopener noreferrer" style={{ textDecoration:"none" }}>
              <div style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"8px 14px", borderRadius:7, background:t.accentGlow, border:`1px solid ${t.border}`, fontSize:14, fontWeight:600, cursor:"pointer" }}>
                <span style={{ color:"#FFFFFF", display:"inline-flex" }}><Icon name="link" size={12}/></span>
                <span style={{ color:GREEN }}>View Source</span>
              </div>
            </a>
          ) : (
            <div style={{ fontSize:13, color:t.textMuted, fontStyle:"italic" }}>Direct URL: [TBD - pending verification]</div>
          )}
        </div>
      </div>
    );
  };

  const tabs = [
    { id:"dashboard", label:"Dashboard" }, { id:"library", label:"Library" },
    { id:"timeline", label:"Timeline" }, { id:"map", label:"Outreach" },
    { id:"highlights", label:"Highlights" },
  ];

  if (!mounted) return null;
  return (
    <div style={{ fontFamily:"'Outfit',system-ui,sans-serif", background:t.bg, minHeight:"100vh", color:t.text, transition:"background 0.3s,color 0.3s" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${t.border};border-radius:3px}`}</style>

      {/* Header */}
      <div style={{ background:t.surface, borderBottom:`1px solid ${t.border}`, position:"sticky", top:0, zIndex:100, boxShadow:t.shadow }}>
        <div style={{ maxWidth:1200, margin:"0 auto", padding:"0 24px", display:"flex", alignItems:"center", justifyContent:"space-between", height:66 }}>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <div style={{ width:48, height:48, borderRadius:8, overflow:"hidden", flexShrink:0, border:`2px solid rgba(255,255,255,0.18)`, boxShadow:"0 0 0 1px rgba(0,167,74,0.35)" }}>
              <img src={`data:image/jpeg;base64,${HEADSHOT}`} alt="Dr. Calvin Mackie" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
            </div>
            <div style={{ fontSize:14, fontWeight:700, color:t.textTitle, fontFamily:"'Sora',sans-serif", letterSpacing:"-0.3px" }}>Dr. Calvin Mackie</div>
          </div>

          <nav style={{ display:"flex", gap:3, background:t.navBg, padding:"5px 6px", borderRadius:8, border:`1px solid ${t.border}` }}>
            {tabs.map(({ id, label }) => (
              <button key={id} style={tabPill(id)} onClick={() => setTab(id)}>{label}</button>
            ))}
          </nav>
        </div>
      </div>

      {/* Content */}
      <div style={{ padding:"24px", maxWidth:1200, margin:"0 auto" }}>
        {tab==="dashboard"  && <Dashboard />}
        {tab==="library"    && <Library />}
        {tab==="timeline"   && <Timeline />}
        {tab==="map"        && <USMap data={MEDIA_DATA} />}
        {tab==="highlights" && <Highlights />}
      </div>

      <Modal />

      <div style={{ textAlign:"center", padding:"16px", fontSize:12, color:t.textMuted, borderTop:`1px solid ${t.border}` }}>
        {`Dr. Calvin Mackie Media Tracker v1 | ${STATS.total} verified catalogued entries | Data: Web Research + STEM NOLA/SGA Press | Updated April 7, 2026`}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DrMackieMediaTracker />);
</script>
</body>
</html>
